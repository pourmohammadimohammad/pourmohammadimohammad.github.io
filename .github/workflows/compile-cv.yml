name: Compile CV

on:
  push:
    branches: [main]
    paths:
      - 'assets/latex/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: My_CV.tex
          working_directory: assets/latex
          latexmk_use_xelatex: true

      - name: Copy PDF to assets
        run: cp assets/latex/My_CV.pdf assets/cv.pdf

      - name: Commit compiled PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv.pdf
          git diff --staged --quiet || git commit -m "Auto-compile CV [skip ci]"
          git push
